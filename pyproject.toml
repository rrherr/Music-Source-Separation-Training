[project]
name = "music-source-separation-training"
description = "BS-RoFormer inference for music source separation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roman Solovyev (ZFTurbo)" }]
dependencies = [
  "einops",
  "numpy>=2.0.0",
  "rotary-embedding-torch",
  "torch>=2.3"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/rrherr/Music-Source-Separation-Training"
Upstream = "https://github.com/ZFTurbo/Music-Source-Separation-Training"

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["msst*"]

[dependency-groups]
test = ["pytest", "hypothesis"]
